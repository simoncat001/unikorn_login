[pytest]
addopts = -q
# Only collect real unit tests under backend/tests.
# The repo contains various `test_*.py` scripts in the backend root that call real services.
testpaths =
    tests
python_files =
    test_*.py

filterwarnings =
    # botocore<2 uses datetime.utcnow internally (Py312+ deprecation warning)
    ignore:datetime\.datetime\.utcnow\(\) is deprecated.*:DeprecationWarning:botocore\.auth
